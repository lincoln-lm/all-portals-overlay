<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            color: white;
            margin: 0px auto;
            overflow: hidden;
            font-family: Maple Mono;
            font-size: 1.25em;
            text-align: center;
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
        }

        p {
            margin: 0px;
        }
    </style>
    <script>
        const STRONGHOLD_DATA = [
            [3, 1280, 2816],
            [6, 4352, 5888],
            [10, 7424, 8960],
            [15, 10496, 12032],
            [21, 13568, 15104],
            [28, 16640, 18176],
            [36, 19712, 21248],
            [10, 22784, 24320],
        ];
        const scale = 125;
        const circles = [];
        const lines = [];
        const drawStronghold = (ctx, x, y, size = 10, color = 'green') => {
            circles.push(() => {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x / scale + 200, -y / scale + 200, size, 0, 2 * Math.PI);
                ctx.fill();
            })
        }
        const drawPath = (ctx, x1, y1, x2, y2, width = 1, color = 'green') => {
            lines.push(() => {
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.beginPath();
                ctx.moveTo(x1 / scale + 200, -y1 / scale + 200);
                ctx.lineTo(x2 / scale + 200, -y2 / scale + 200);
                ctx.stroke();
            })
        }
        let MEASURED = [];
        let PATHS = [];
        let canvas;
        let ctx;
        let strongholds = [];
        let progress = 0;

        const drawStrongholds = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = `rgba(0, 0, 0, 0.5)`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            lines.length = 0;
            circles.length = 0;
            // background
            for (let index = 0; index < MEASURED.length; index++) {
                const [x, y] = MEASURED[index];
                drawStronghold(ctx, x, y, 4, '#ffffff7f');
            }
            for (let index = 0; index < strongholds.length; index++) {
                const [x, y] = strongholds[index];
                drawStronghold(ctx, x, y, 4, '#ffffff7f');
            }
            for (let path_index = 0; path_index < PATHS.length; path_index++) {
                let path = PATHS[path_index];
                if (path.length == 0) {
                    continue;
                }
                const [first_type, first_i] = path[0];
                let last = first_i == 0 ? MEASURED[MEASURED.length - 2] : strongholds[first_i - 1];

                for (let index = 0; index < path.length; index++) {
                    const [type, i] = path[index];
                    const [x, y] = i == 0 ? MEASURED[MEASURED.length - 2] : strongholds[i - 1];
                    const line_width = index == progress + 1 ? 2 : 1;
                    if (type != 'origin') {
                        drawPath(ctx, last[0], last[1], x, y, line_width, '#ffffff7f');
                    }
                    if (type != 'reset') {
                        last = [x, y];
                    }
                }
                for (let test = progress; test < path.length && test >= 0; test--) {
                    const [type, i] = path[test];
                    const [x, y] = i == 0 ? MEASURED[MEASURED.length - 2] : strongholds[i - 1];
                    if (type == 'goto') {
                        last = [x, y];
                        break;
                    }
                }
                // foreground
                for (let index = progress; index < path.length; index++) {
                    const [type, i] = path[index];
                    const [x, y] = i == 0 ? MEASURED[MEASURED.length - 2] : strongholds[i - 1];
                    const line_color = index == progress + 1 ? '#f28dff' : '#6e1c98';
                    const line_width = index == progress + 1 ? 4 : 3;
                    const stronghold_color = index == progress ? '#9e4cc8' : '#f28dff';
                    let [from_x, from_y] = [x, y];
                    if (type == 'goto') {
                        drawPath(ctx, last[0], last[1], x, y, line_width, line_color);
                    } else if (type == 'reset') {
                        if (index == progress) {
                            [from_x, from_y] = last;
                        } else {
                            drawPath(ctx, last[0], last[1], x, y, line_width, line_color);
                        }
                    }
                    drawStronghold(ctx, from_x, from_y, 5, stronghold_color);
                    if (type != 'reset') {
                        last = [x, y];
                    }
                }
            }
            for (let i = 0; i < lines.length; i++) {
                lines[i]();
            }
            for (let i = 0; i < circles.length; i++) {
                circles[i]();
            }
        }

        const nextAction = () => {
            if (progress >= PATHS[0].length - 1) {
                return "Complete!";
            }
            const [type, i] = PATHS[0][progress + 1];
            const [last_type, last_i] = PATHS[0][progress];
            let [x, y] = i == 0 ? MEASURED[MEASURED.length - 2] : strongholds[i - 1];
            let [last_x, last_y] = last_i == 0 ? MEASURED[MEASURED.length - 2] : strongholds[last_i - 1];
            x = Math.round(x / 128);
            y = Math.round(y / 128);
            last_x = Math.round(last_x / 128);
            last_y = Math.round(last_y / 128);
            let deltaX = last_x - x;
            let deltaZ = last_y - y;

            let theta = (Math.atan2(deltaZ, deltaX) * 180 / Math.PI + 90) % 360;
            if (theta > 180) {
                theta -= 360;
            }
            if (theta < -180) {
                theta += 360;
            }
            if (progress < PATHS[0].length - 2) {
                const [next_type, next_i] = PATHS[0][progress + 2];
                const [next_x, next_y] = next_i == 0 ? MEASURED[MEASURED.length - 2] : strongholds[next_i - 1];
                if (next_type == 'origin') {
                    return `Take bed and go to (${x}, ${y})\n(don't set spawn)\n${theta.toFixed(1)}`;
                }
            }
            if (type == 'goto') {
                return `Take bed and go to (${x}, ${y})\n${theta.toFixed(1)}`;
            } else if (type == 'reset') {
                return `Leave bed and go to (${x}, ${y})\n${theta.toFixed(1)}`;
            } else if (type == 'origin') {
                return `Take bed and go to (${x}, ${y})\n${theta.toFixed(1)}`;
            }
        }

        const updateProgress = (add) => {
            progress = progress + add;
            if (progress >= PATHS[0].length) {
                progress = PATHS[0].length - 1;
            } else if (progress < 0) {
                progress = 0;
            }

            document.getElementById('text').textContent = `${progress + 8}/129\n` + nextAction();
            drawStrongholds();
        }

        window.addEventListener('load', () => {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            const eventSource = new EventSource("/data");
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type == "next") {
                    updateProgress(1);
                } else if (data.type == "prev") {
                    updateProgress(-1);
                } else if (data.type == "path") {
                    MEASURED = data.measured;
                    for (let i = 0; i < MEASURED.length; i++) {
                        const [x, y] = MEASURED[i];
                        MEASURED[i] = [x * 16, y * 16];
                    }
                    PATHS = data.paths;

                    strongholds = [];
                    for (let i = 0; i < STRONGHOLD_DATA.length; i++) {
                        const [count, minimum, maximum] = STRONGHOLD_DATA[i];
                        const [first_x, first_y] = MEASURED[i];
                        const first_angle = Math.atan2(first_y, first_x);
                        for (let stronghold = 1; stronghold < count; stronghold++) {
                            let angle = first_angle + 2 * Math.PI / count * stronghold;
                            let distance = (maximum + minimum) / 2;
                            let x = Math.cos(angle) * distance;
                            let y = Math.sin(angle) * distance;
                            strongholds.push([x, y])
                        }
                    }
                    document.getElementById('text').textContent = data.message;
                    drawStrongholds();
                } else if (data.type == "solved") {
                    updateProgress(0);
                } else if (data.type == "reset") {
                    MEASURED = [];
                    PATHS = [];
                    strongholds = [];
                    progress = 0;
                    document.getElementById('text').textContent = "";
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
        });
    </script>
</head>

<body>
    <div id="all" style="width: 400px;">
        <canvas width="400" height="400" id="canvas"></canvas>
        <p style="white-space: pre" id="text"></p>
    </div>
</body>

</html>
